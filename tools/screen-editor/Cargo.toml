[package]
name = "screen-editor"
version = "0.1.0"
edition = "2021"
description = "Desktop layout/theme editor for the Telegram LÖVE client screens"

[[bin]]
name = "screen-editor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true